name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    defaults:
      run:
        working-directory: SVM-SVR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest Foundations/Tests -q
